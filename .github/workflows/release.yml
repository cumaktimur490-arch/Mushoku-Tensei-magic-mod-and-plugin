name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and attach standalone Weather and Magic jars
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Fabric targets Java 21; ports target Java 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build Fabric Weather and Magic
        run: |
          ./gradlew --no-daemon clean :weather:clean
          ./gradlew --no-daemon :weather:build build

      - name: Build native Weather and Magic 1.20.1 loader ports
        run: |
          ./gradlew --no-daemon -p ports clean :weather-forge:clean :weather-neoforge:clean
          ./gradlew --no-daemon -p ports :weather-forge:build :weather-neoforge:build :forge:build :neoforge:build

      - name: Verify volumetric Weather rendering resources are packaged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          patterns = (
              "weather/build/libs/mushoku-weather-*.jar",
              "ports/weather-forge/build/libs/mushoku-weather-forge-1.20.1-*.jar",
              "ports/weather-neoforge/build/libs/mushoku-weather-neoforge-1.20.1-*.jar",
          )
          required = (
              "assets/mushoku_weather/shaders/volume_cloud.vert",
              "assets/mushoku_weather/shaders/volume_cloud.frag",
              "assets/mushoku_weather/textures/cloud_noise.png",
          )
          for pattern in patterns:
              jars = [path for path in Path().glob(pattern) if not path.stem.endswith("-sources")]
              if len(jars) != 1:
                  raise SystemExit(f"Expected exactly one Weather jar for {pattern}, found {jars}")
              with ZipFile(jars[0]) as jar:
                  names = set(jar.namelist())
                  missing = set(required) - names
                  if missing:
                      raise SystemExit(f"{jars[0]} is missing Weather rendering resources: {sorted(missing)}")
              print(f"Verified volumetric Weather resources in {jars[0]}")
          PY

      - name: Verify native Magic and Weather package sets are disjoint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_native_package_uniqueness.py \
            --pair Forge 'ports/forge/build/libs/mushoku-magic-forge-1.20.1-*.jar' 'ports/weather-forge/build/libs/mushoku-weather-forge-1.20.1-*.jar' \
            --pair NeoForge 'ports/neoforge/build/libs/mushoku-magic-neoforge-1.20.1-*.jar' 'ports/weather-neoforge/build/libs/mushoku-weather-neoforge-1.20.1-*.jar'

      - name: Attach all six platform jars to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          magic_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          weather_version="$(sed -n 's/^weather_version=//p' gradle.properties)"
          port_magic_version="$(sed -n 's/^port_version=//p' ports/gradle.properties)"
          port_weather_version="$(sed -n 's/^weather_port_version=//p' ports/gradle.properties)"
          for version in "$magic_version" "$weather_version" "$port_magic_version" "$port_weather_version"; do
            test -n "$version"
          done
          fabric_magic="build/libs/mushoku-magic-${magic_version}.jar"
          fabric_weather="weather/build/libs/mushoku-weather-${weather_version}.jar"
          forge_magic="ports/forge/build/libs/mushoku-magic-forge-1.20.1-${port_magic_version}.jar"
          forge_weather="ports/weather-forge/build/libs/mushoku-weather-forge-1.20.1-${port_weather_version}.jar"
          neoforge_magic="ports/neoforge/build/libs/mushoku-magic-neoforge-1.20.1-${port_magic_version}.jar"
          neoforge_weather="ports/weather-neoforge/build/libs/mushoku-weather-neoforge-1.20.1-${port_weather_version}.jar"
          for jar in "$fabric_magic" "$fabric_weather" "$forge_magic" "$forge_weather" "$neoforge_magic" "$neoforge_weather"; do
            test -f "$jar"
          done
          gh release upload "$GITHUB_REF_NAME" \
            "$fabric_magic" "$fabric_weather" \
            "$forge_magic" "$forge_weather" \
            "$neoforge_magic" "$neoforge_weather" \
            --clobber
