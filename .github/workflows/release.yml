name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and attach mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build the mod
        run: ./gradlew --no-daemon clean build

      - name: Attach the mod jar to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$version"
          jar="build/libs/mushoku-magic-${version}.jar"
          test -f "$jar"
          gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
