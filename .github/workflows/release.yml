name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and attach Fabric, Forge, and NeoForge jars
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Fabric targets Java 21; ports target Java 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build the Fabric mod
        run: ./gradlew --no-daemon clean build

      - name: Build both native 1.20.1 loader ports (Java 17 bytecode)
        run: ./gradlew --no-daemon -p ports clean :forge:build :neoforge:build

      - name: Attach all platform jars to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fabric_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          port_version="$(sed -n 's/^port_version=//p' ports/gradle.properties)"
          test -n "$fabric_version"
          test -n "$port_version"
          fabric_jar="build/libs/mushoku-magic-${fabric_version}.jar"
          forge_jar="ports/forge/build/libs/mushoku-magic-forge-1.20.1-${port_version}.jar"
          neoforge_jar="ports/neoforge/build/libs/mushoku-magic-neoforge-1.20.1-${port_version}.jar"
          test -f "$fabric_jar"
          test -f "$forge_jar"
          test -f "$neoforge_jar"
          gh release upload "$GITHUB_REF_NAME" "$fabric_jar" "$forge_jar" "$neoforge_jar" --clobber
