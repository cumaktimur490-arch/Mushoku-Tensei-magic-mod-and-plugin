name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified standalone Weather and dependent Magic jars for all loaders
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 25, Java 21 bytecode)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and link the volumetric GLSL shaders
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslang-tools
          cmp weather/src/main/resources/assets/mushoku_weather/shaders/volume_cloud.vert ports/weather-common/src/main/resources/assets/mushoku_weather/shaders/volume_cloud.vert
          cmp weather/src/main/resources/assets/mushoku_weather/shaders/volume_cloud.frag ports/weather-common/src/main/resources/assets/mushoku_weather/shaders/volume_cloud.frag
          cmp weather/src/main/resources/assets/mushoku_weather/textures/cloud_noise.png ports/weather-common/src/main/resources/assets/mushoku_weather/textures/cloud_noise.png
          python3 scripts/generate_weather_noise_texture.py --check
          glslangValidator -l \
            weather/src/main/resources/assets/mushoku_weather/shaders/volume_cloud.vert \
            weather/src/main/resources/assets/mushoku_weather/shaders/volume_cloud.frag

      - name: Run tests and build the mod
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean :weather:clean --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          ./gradlew --no-daemon :weather:build build --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle failure details
        if: failure()
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/gradle-build.log"
          [[ -f "$log_file" ]] || exit 0
          grep -E 'FAILURE:|What went wrong:|Exception is:|Execution failed for task|Could not find|Could not resolve|No matching variant|error:|cannot find symbol|symbol:|location:|Caused by:' "$log_file" | tail -n 12 > "$RUNNER_TEMP/gradle-errors.log" || true
          if [[ ! -s "$RUNNER_TEMP/gradle-errors.log" ]]; then
            tail -n 12 "$log_file" > "$RUNNER_TEMP/gradle-errors.log"
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line:0:900}"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=Gradle diagnostic::$line"
          done < "$RUNNER_TEMP/gradle-errors.log"

      - name: Read Fabric artifact version
        id: fabric-version
        shell: bash
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Read Fabric Weather artifact version
        id: weather-version
        shell: bash
        run: echo "version=$(sed -n 's/^weather_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Verify Fabric staff display transforms
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          jars = [path for path in Path("build/libs").glob("mushoku-magic-*.jar") if not path.stem.endswith("-sources")]
          if len(jars) != 1:
              raise SystemExit(f"Expected one Fabric runtime jar, found {jars}")
          required_hands = (
              "firstperson_righthand", "firstperson_lefthand",
              "thirdperson_righthand", "thirdperson_lefthand",
          )
          with ZipFile(jars[0]) as jar:
              for item_id in (
                  "wand_1", "wand_2", "wand_3",
                  "enchanted_stick_1", "enchanted_stick_2", "enchanted_stick_3",
              ):
                  path = f"assets/mushoku_magic/models/item/{item_id}.json"
                  model = json.loads(jar.read(path))
                  if model.get("parent") != "minecraft:item/handheld":
                      raise SystemExit(f"{jars[0]} model {path} is not handheld")
                  display = model.get("display", {})
                  for hand in required_hands:
                      transform = display.get(hand)
                      if transform is None:
                          raise SystemExit(f"{jars[0]} model {path} has no {hand} transform")
                      if any(len(transform.get(field, [])) != 3 for field in ("rotation", "translation", "scale")):
                          raise SystemExit(f"{jars[0]} model {path} has an incomplete {hand} transform")
                      if any(not 0.0 < value <= 1.0 for value in transform["scale"]):
                          raise SystemExit(f"{jars[0]} model {path} has an invalid {hand} scale")
          print(f"Verified staff hand transforms in {jars[0]}")
          PY

      - name: Verify standalone Fabric Weather jar
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          jars = [path for path in Path("weather/build/libs").glob("mushoku-weather-*.jar") if not path.stem.endswith("-sources")]
          if len(jars) != 1:
              raise SystemExit(f"Expected one Fabric Weather runtime jar, found {jars}")
          with ZipFile(jars[0]) as jar:
              metadata = json.loads(jar.read("fabric.mod.json"))
              if metadata.get("id") != "mushoku_weather":
                  raise SystemExit(f"{jars[0]} is not the standalone Weather mod")
              if "mushoku_magic" in metadata.get("depends", {}):
                  raise SystemExit("The standalone Weather mod must not depend on Magic")
              names = set(jar.namelist())
              if "com/mushokumagic/weather/world/RegionalWeatherManager.class" not in names:
                  raise SystemExit(f"{jars[0]} is missing its weather simulation")
              if "com/mushokumagic/weather/api/WeatherApi.class" not in names:
                  raise SystemExit(f"{jars[0]} is missing its public integration API")
              if "com/mushokumagic/weather/world/VolumetricCloudRenderer.class" not in names:
                  raise SystemExit(f"{jars[0]} is missing its GPU cloud renderer")
              for shader in (
                      "assets/mushoku_weather/shaders/volume_cloud.vert",
                      "assets/mushoku_weather/shaders/volume_cloud.frag",
                      "assets/mushoku_weather/textures/cloud_noise.png"):
                  if shader not in names:
                      raise SystemExit(f"{jars[0]} is missing shader resource {shader}")
              if "com/mushokumagic/spell/SpellEffects.class" in names:
                  raise SystemExit(f"{jars[0]} incorrectly bundles the Magic mod")
          print(f"Verified standalone Weather jar {jars[0]}")
          PY

      - name: Upload the Fabric Magic jar
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-magic-fabric-${{ github.sha }}
          path: build/libs/mushoku-magic-${{ steps.fabric-version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload the Fabric Weather jar
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-weather-fabric-${{ github.sha }}
          path: weather/build/libs/mushoku-weather-${{ steps.weather-version.outputs.version }}.jar
          if-no-files-found: error

  loader-ports:
    name: Build and test Forge/NeoForge 1.20.1 ports (JDK 25, Java 17 bytecode)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run both native loader builds and tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -p ports clean :weather-forge:clean :weather-neoforge:clean --stacktrace 2>&1 | tee "$RUNNER_TEMP/ports-build.log"
          ./gradlew --no-daemon -p ports :weather-forge:build :weather-neoforge:build :forge:build :neoforge:build --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/ports-build.log"

      - name: Surface native build failure details
        if: failure()
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/ports-build.log"
          [[ -f "$log_file" ]] || exit 0
          grep -E 'FAILURE:|What went wrong:|Exception is:|Execution failed for task|Could not find|Could not resolve|No matching variant|error:|cannot find symbol|symbol:|location:|Caused by:' "$log_file" | tail -n 16 > "$RUNNER_TEMP/ports-errors.log" || true
          if [[ ! -s "$RUNNER_TEMP/ports-errors.log" ]]; then
            tail -n 16 "$log_file" > "$RUNNER_TEMP/ports-errors.log"
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line:0:900}"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=Native build diagnostic::$line"
          done < "$RUNNER_TEMP/ports-errors.log"

      - name: Verify native loader metadata and jar contents
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          artifacts = {
              "Forge Magic": (Path("ports/forge/build/libs"), "mushoku-magic-forge-1.20.1-*.jar", "magic", True),
              "NeoForge Magic": (Path("ports/neoforge/build/libs"), "mushoku-magic-neoforge-1.20.1-*.jar", "magic", False),
              "Forge Weather": (Path("ports/weather-forge/build/libs"), "mushoku-weather-forge-1.20.1-*.jar", "weather", False),
              "NeoForge Weather": (Path("ports/weather-neoforge/build/libs"), "mushoku-weather-neoforge-1.20.1-*.jar", "weather", False),
          }
          item_ids = [
              "magic_stone_1", "magic_stone_2", "magic_stone_3",
              "enchanted_stick_1", "enchanted_stick_2", "enchanted_stick_3",
              "wand_1", "wand_2", "wand_3",
          ]
          held_item_ids = [
              "wand_1", "wand_2", "wand_3",
              "enchanted_stick_1", "enchanted_stick_2", "enchanted_stick_3",
          ]
          required_hands = (
              "firstperson_righthand", "firstperson_lefthand",
              "thirdperson_righthand", "thirdperson_lefthand",
          )
          for loader, (directory, pattern, mod_kind, luxium_expected) in artifacts.items():
              jars = [jar for jar in directory.glob(pattern) if not jar.stem.endswith("-sources")]
              if len(jars) != 1:
                  raise SystemExit(f"Expected exactly one {loader} runtime jar, found {jars}")
              with ZipFile(jars[0]) as jar:
                  names = set(jar.namelist())
                  if "fabric.mod.json" in names:
                      raise SystemExit(f"{jars[0]} incorrectly contains Fabric metadata")
                  metadata = jar.read("META-INF/mods.toml").decode("utf-8")
                  has_luxium = 'modId="luxium"' in metadata
                  if has_luxium != luxium_expected:
                      raise SystemExit(f"Luxium dependency metadata is incorrect in {jars[0]}")
                  if mod_kind == "magic":
                      if 'modId="mushoku_magic"' not in metadata or 'modId="mushoku_weather"' not in metadata:
                          raise SystemExit(f"{jars[0]} is missing Magic metadata or its required Weather dependency")
                      if ("com/mushokumagic/weather/world/RegionalWeatherManager.class" in names
                              or "com/mushokumagic/weather/api/WeatherApi.class" in names):
                          raise SystemExit(f"{jars[0]} incorrectly bundles the Weather mod")
                      required_resources = {
                          "pack.mcmeta",
                          "assets/mushoku_magic/lang/en_us.json",
                          "assets/mushoku_magic/lang/ru_ru.json",
                      }
                      for item_id in item_ids:
                          required_resources.add(f"assets/mushoku_magic/models/item/{item_id}.json")
                          required_resources.add(f"assets/mushoku_magic/textures/item/{item_id}.png")
                          required_resources.add(f"data/mushoku_magic/recipes/{item_id}.json")
                      missing_resources = required_resources - names
                      if missing_resources:
                          raise SystemExit(f"{jars[0]} is missing resources: {sorted(missing_resources)}")
                      pack_metadata = json.loads(jar.read("pack.mcmeta"))
                      if pack_metadata.get("pack", {}).get("pack_format") != 15:
                          raise SystemExit(f"{jars[0]} has invalid Minecraft 1.20.1 pack metadata")
                      for item_id in held_item_ids:
                          model_path = f"assets/mushoku_magic/models/item/{item_id}.json"
                          model = json.loads(jar.read(model_path))
                          if model.get("parent") != "minecraft:item/handheld":
                              raise SystemExit(f"{jars[0]} model {model_path} is not handheld")
                          display = model.get("display", {})
                          for hand in required_hands:
                              transform = display.get(hand)
                              if transform is None:
                                  raise SystemExit(f"{jars[0]} model {model_path} has no {hand} transform")
                              if any(len(transform.get(field, [])) != 3 for field in ("rotation", "translation", "scale")):
                                  raise SystemExit(f"{jars[0]} model {model_path} has an incomplete {hand} transform")
                              if any(not 0.0 < value <= 1.0 for value in transform["scale"]):
                                  raise SystemExit(f"{jars[0]} model {model_path} has an invalid {hand} scale")
                  else:
                      if 'modId="mushoku_weather"' not in metadata:
                          raise SystemExit(f"{jars[0]} is missing Weather loader metadata")
                      if 'modId="mushoku_magic"' in metadata:
                          raise SystemExit(f"{jars[0]} must not depend on the Magic mod")
                      if "com/mushokumagic/weather/world/RegionalWeatherManager.class" not in names:
                          raise SystemExit(f"{jars[0]} is missing the weather simulation")
                      if "com/mushokumagic/weather/api/WeatherApi.class" not in names:
                          raise SystemExit(f"{jars[0]} is missing its public integration API")
                      if "com/mushokumagic/weather/world/VolumetricCloudRenderer.class" not in names:
                          raise SystemExit(f"{jars[0]} is missing its GPU cloud renderer")
                      for shader in (
                              "assets/mushoku_weather/shaders/volume_cloud.vert",
                              "assets/mushoku_weather/shaders/volume_cloud.frag",
                              "assets/mushoku_weather/textures/cloud_noise.png"):
                          if shader not in names:
                              raise SystemExit(f"{jars[0]} is missing shader resource {shader}")
                      if "com/mushokumagic/spell/SpellEffects.class" in names:
                          raise SystemExit(f"{jars[0]} incorrectly bundles the Magic mod")
              print(f"Verified {loader}: {jars[0]}")
          PY

      - name: Verify native Magic and Weather package sets are disjoint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_native_package_uniqueness.py \
            --pair Forge 'ports/forge/build/libs/mushoku-magic-forge-1.20.1-*.jar' 'ports/weather-forge/build/libs/mushoku-weather-forge-1.20.1-*.jar' \
            --pair NeoForge 'ports/neoforge/build/libs/mushoku-magic-neoforge-1.20.1-*.jar' 'ports/weather-neoforge/build/libs/mushoku-weather-neoforge-1.20.1-*.jar'

      - name: Upload all native Magic and Weather jars
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-native-mods-${{ github.sha }}
          path: |
            ports/forge/build/libs/mushoku-magic-forge-1.20.1-*.jar
            ports/neoforge/build/libs/mushoku-magic-neoforge-1.20.1-*.jar
            ports/weather-forge/build/libs/mushoku-weather-forge-1.20.1-*.jar
            ports/weather-neoforge/build/libs/mushoku-weather-neoforge-1.20.1-*.jar
          if-no-files-found: error

  publish-release:
    name: Publish verified release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[publish-release]') ||
        contains(github.event.head_commit.message, '[publish-beta]')
      ))
    needs:
      - build
      - loader-ports
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download Fabric Magic jar
        uses: actions/download-artifact@v4
        with:
          name: mushoku-magic-fabric-${{ github.sha }}
          path: release-assets

      - name: Download Fabric Weather jar
        uses: actions/download-artifact@v4
        with:
          name: mushoku-weather-fabric-${{ github.sha }}
          path: release-assets

      - name: Download native Forge and NeoForge jars
        uses: actions/download-artifact@v4
        with:
          name: mushoku-native-mods-${{ github.sha }}
          path: release-assets

      - name: Verify release jars
        id: release-jars
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          def properties(path):
              return dict(
                  line.split("=", 1)
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
                  if line and not line.startswith("#") and "=" in line
              )

          fabric = properties("gradle.properties")
          ports = properties("ports/gradle.properties")
          artifacts = {
              "Fabric Magic": (f"mushoku-magic-{fabric['mod_version']}.jar", "magic", "fabric", True),
              "Fabric Weather": (f"mushoku-weather-{fabric['weather_version']}.jar", "weather", "fabric", False),
              "Forge Magic": (f"mushoku-magic-forge-1.20.1-{ports['port_version']}.jar", "magic", "forge", True),
              "Forge Weather": (f"mushoku-weather-forge-1.20.1-{ports['weather_port_version']}.jar", "weather", "forge", False),
              "NeoForge Magic": (f"mushoku-magic-neoforge-1.20.1-{ports['port_version']}.jar", "magic", "neoforge", False),
              "NeoForge Weather": (f"mushoku-weather-neoforge-1.20.1-{ports['weather_port_version']}.jar", "weather", "neoforge", False),
          }
          root = Path("release-assets")
          for label, (filename, mod_kind, loader, luxium_expected) in artifacts.items():
              matches = list(root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {label} jar named {filename}; found {matches}")
              jar_path = matches[0]
              with ZipFile(jar_path) as jar:
                  names = set(jar.namelist())
                  if loader == "fabric":
                      if "fabric.mod.json" not in names or "META-INF/mods.toml" in names:
                          raise SystemExit(f"{jar_path} has incorrect Fabric metadata")
                      metadata = json.loads(jar.read("fabric.mod.json"))
                      expected_id = "mushoku_magic" if mod_kind == "magic" else "mushoku_weather"
                      if metadata.get("id") != expected_id:
                          raise SystemExit(f"{jar_path} has the wrong Fabric mod id")
                      if mod_kind == "magic" and "mushoku_weather" not in metadata.get("depends", {}):
                          raise SystemExit(f"{jar_path} must require Mushoku Weather")
                      if mod_kind == "weather" and "mushoku_magic" in metadata.get("depends", {}):
                          raise SystemExit(f"{jar_path} must not depend on Mushoku Magic")
                  else:
                      if "fabric.mod.json" in names or "META-INF/mods.toml" not in names:
                          raise SystemExit(f"{jar_path} is not a native loader jar")
                      metadata = jar.read("META-INF/mods.toml").decode("utf-8")
                      if mod_kind == "magic":
                          if 'modId="mushoku_magic"' not in metadata or 'modId="mushoku_weather"' not in metadata:
                              raise SystemExit(f"{jar_path} is missing the Magic id or Weather dependency")
                      else:
                          if 'modId="mushoku_weather"' not in metadata or 'modId="mushoku_magic"' in metadata:
                              raise SystemExit(f"{jar_path} has incorrect standalone Weather metadata")
                      has_luxium = 'modId="luxium"' in metadata
                      if has_luxium != luxium_expected:
                          raise SystemExit(f"Luxium metadata is incorrect in {jar_path}")
                  if mod_kind == "magic" and (
                          "com/mushokumagic/weather/world/RegionalWeatherManager.class" in names
                          or "com/mushokumagic/weather/api/WeatherApi.class" in names):
                      raise SystemExit(f"{jar_path} incorrectly bundles the Weather mod")
                  if mod_kind == "weather" and "com/mushokumagic/weather/api/WeatherApi.class" not in names:
                      raise SystemExit(f"{jar_path} is missing the Weather integration API")
                  if mod_kind == "weather":
                      for resource in (
                              "assets/mushoku_weather/shaders/volume_cloud.vert",
                              "assets/mushoku_weather/shaders/volume_cloud.frag",
                              "assets/mushoku_weather/textures/cloud_noise.png"):
                          if resource not in names:
                              raise SystemExit(f"{jar_path} is missing Weather rendering resource {resource}")
                  if mod_kind == "weather" and "com/mushokumagic/spell/SpellEffects.class" in names:
                      raise SystemExit(f"{jar_path} incorrectly bundles the Magic mod")
              print(f"Verified {label}: {jar_path}")
          PY
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mapfile -t assets < <(find release-assets -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "Expected exactly six runtime jars, found ${#assets[@]}: ${assets[*]}" >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}" > "$RUNNER_TEMP/release-assets.txt"

      - name: Verify native JAR package uniqueness in release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_native_package_uniqueness.py \
            --pair Forge 'release-assets/**/mushoku-magic-forge-1.20.1-*.jar' 'release-assets/**/mushoku-weather-forge-1.20.1-*.jar' \
            --pair NeoForge 'release-assets/**/mushoku-magic-neoforge-1.20.1-*.jar' 'release-assets/**/mushoku-weather-neoforge-1.20.1-*.jar'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-jars.outputs.version }}
          BETA_RELEASE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-beta]') }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          title="Mushoku Tensei: Magic + Weather v${VERSION}"
          release_flags=(--latest)
          beta_number=0
          if [[ "${BETA_RELEASE}" == "true" ]]; then
            beta_prefix="${tag}-beta."
            while IFS= read -r existing_tag; do
              [[ "$existing_tag" == "${beta_prefix}"* ]] || continue
              suffix="${existing_tag#"${beta_prefix}"}"
              [[ "$suffix" =~ ^[0-9]+$ ]] || continue
              candidate=$((10#$suffix))
              if (( candidate > beta_number )); then
                beta_number="$candidate"
              fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name')
            beta_number=$((beta_number + 1))
            tag="${tag}-beta.${beta_number}"
            title="${title} Beta ${beta_number}"
            release_flags=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Highlights

          - Weather is now a standalone mod and can run without Magic. Magic requires Weather; install both matching jars to use weather-interacting spells.
          - Cumulonimbus synchronizes a real 20×20-chunk local storm sector and cast altitude; clients render its shader-raymarched volumetric cloud, rain, and thunder locally without changing dimension-wide server weather.
          - Adds GPU ray-marched 3D cloud volumes with procedural density/noise for cumulonimbus towers, supercell anvils and rotating wall clouds, squall shelves, cyclone bands, tornado funnels, sandstorm walls, and regional overcast. Particles are auxiliary rain, hail, wind, lightning, and ground dust—not cloud bodies.
          - Adds an original seamless multi-channel cloud-noise texture, projected through the 3D raymarch to carve larger billows, soft edges, and fine erosion detail without drawing flat cloud sprites.
          - Cloud quality, active volume budget, and render distance are configurable; local moving storms retain formation, mature, strengthening, and dissipating phases with rain curtains, hail, and strong winds.
          - `/magicweather supercell` and `/magicweather squall` start local storms; spawn frequency, size, strength, active-system limits, and strengthening are configurable. Optional tornado/cyclone block damage is off by default and strictly capped.
          - Tornado and cyclone smoke receives bounded inward, rotational, and upward velocities without expensive all-pairs particle collisions.
          - Staff and enchanted-stick models have per-item hand orientation, scale, translation, and left/right first- and third-person transforms.
          - Includes separate Fabric 1.21.11 and native Forge/NeoForge 1.20.1 Weather and Magic jars. Install only the matching loader/version pair.
          - Fixes the native Forge/NeoForge split-package conflict that stopped startup when Magic and Weather were installed together; CI now verifies that both jars in each native pair expose disjoint Java packages.
          - The Forge Magic jar declares Luxium and Embeddium as optional client-side dependencies. No Luxium-specific renderer patch is claimed.

          ## Verification

          - GitHub Actions passed for all six Fabric, Forge, and NeoForge mod builds and their mod-specific test suites.
          - CI regenerated the expected cloud-noise pixels from a deterministic script, verified both PNG copies are identical, compiled and linked the GLSL vertex/fragment shader pair, verified all three Weather rendering assets are packaged in all Weather jars, and checked loader metadata, dependency direction, Forge-only optional Luxium metadata, package uniqueness, and staff hand transforms.
          EOF
          if [[ "${BETA_RELEASE}" == "true" ]]; then
            cat > "$RUNNER_TEMP/beta-warning.md" <<'EOF'
          > **Beta notice:** CI builds, tests, shader compilation, and native package checks passed. No in-game visual or performance QA has been performed; cloud appearance, rendering order, and performance remain unverified.
          >
          > **Earlier beta notice:** `v2.5.0-beta.1` had a Forge/NeoForge 1.20.1 split-package startup failure; it was fixed in `v2.5.0-beta.2` and remains fixed here.

          EOF
            cat "$RUNNER_TEMP/beta-warning.md" "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/final-release-notes.md"
          else
            cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/final-release-notes.md"
          fi
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/final-release-notes.md" \
            "${release_flags[@]}"
