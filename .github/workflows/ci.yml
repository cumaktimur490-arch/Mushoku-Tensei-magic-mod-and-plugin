name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Fabric, Forge, and NeoForge jars as a GitHub Release
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 25, Java 21 bytecode)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build the mod
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle failure details
        if: failure()
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/gradle-build.log"
          [[ -f "$log_file" ]] || exit 0
          grep -E 'FAILURE:|What went wrong:|Exception is:|Execution failed for task|Could not find|Could not resolve|No matching variant|error:|cannot find symbol|symbol:|location:|Caused by:' "$log_file" | tail -n 12 > "$RUNNER_TEMP/gradle-errors.log" || true
          if [[ ! -s "$RUNNER_TEMP/gradle-errors.log" ]]; then
            tail -n 12 "$log_file" > "$RUNNER_TEMP/gradle-errors.log"
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line:0:900}"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=Gradle diagnostic::$line"
          done < "$RUNNER_TEMP/gradle-errors.log"

      - name: Read Fabric artifact version
        id: fabric-version
        shell: bash
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Upload the Fabric mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-magic-fabric-${{ github.sha }}
          path: build/libs/mushoku-magic-${{ steps.fabric-version.outputs.version }}.jar
          if-no-files-found: error

  loader-ports:
    name: Build and test Forge/NeoForge 1.20.1 ports (JDK 25, Java 17 bytecode)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run both native loader builds and tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon -p ports clean :forge:build :neoforge:build --stacktrace 2>&1 | tee "$RUNNER_TEMP/ports-build.log"

      - name: Surface native build failure details
        if: failure()
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/ports-build.log"
          [[ -f "$log_file" ]] || exit 0
          grep -E 'FAILURE:|What went wrong:|Exception is:|Execution failed for task|Could not find|Could not resolve|No matching variant|error:|cannot find symbol|symbol:|location:|Caused by:' "$log_file" | tail -n 16 > "$RUNNER_TEMP/ports-errors.log" || true
          if [[ ! -s "$RUNNER_TEMP/ports-errors.log" ]]; then
            tail -n 16 "$log_file" > "$RUNNER_TEMP/ports-errors.log"
          fi
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line:0:900}"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=Native build diagnostic::$line"
          done < "$RUNNER_TEMP/ports-errors.log"

      - name: Verify native loader metadata and jar contents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          artifacts = {
              "Forge": (Path("ports/forge/build/libs"), "mushoku-magic-forge-1.20.1-*.jar", True),
              "NeoForge": (Path("ports/neoforge/build/libs"), "mushoku-magic-neoforge-1.20.1-*.jar", False),
          }
          for loader, (directory, pattern, luxium_expected) in artifacts.items():
              jars = [jar for jar in directory.glob(pattern) if not jar.stem.endswith("-sources")]
              if len(jars) != 1:
                  raise SystemExit(f"Expected exactly one {loader} mod jar, found {jars}")
              with ZipFile(jars[0]) as jar:
                  names = set(jar.namelist())
                  if "fabric.mod.json" in names:
                      raise SystemExit(f"{jars[0]} incorrectly contains fabric.mod.json")
                  metadata = jar.read("META-INF/mods.toml").decode("utf-8")
                  if 'modId="mushoku_magic"' not in metadata:
                      raise SystemExit(f"{jars[0]} is missing native loader metadata")
                  has_luxium = 'modId="luxium"' in metadata
                  if has_luxium != luxium_expected:
                      raise SystemExit(f"Luxium dependency metadata is incorrect in {jars[0]}")
              print(f"Verified {jars[0]}")
          PY

      - name: Upload Forge and NeoForge jars
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-magic-ports-${{ github.sha }}
          path: |
            ports/forge/build/libs/mushoku-magic-forge-1.20.1-*.jar
            ports/neoforge/build/libs/mushoku-magic-neoforge-1.20.1-*.jar
          if-no-files-found: error

  publish-release:
    name: Publish verified release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
    needs:
      - build
      - loader-ports
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download Fabric jar
        uses: actions/download-artifact@v4
        with:
          name: mushoku-magic-fabric-${{ github.sha }}
          path: release-assets

      - name: Download Forge and NeoForge jars
        uses: actions/download-artifact@v4
        with:
          name: mushoku-magic-ports-${{ github.sha }}
          path: release-assets

      - name: Verify release jars
        id: release-jars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          def properties(path):
              return dict(
                  line.split("=", 1)
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
                  if line and not line.startswith("#") and "=" in line
              )

          fabric_version = properties("gradle.properties")["mod_version"]
          port_version = properties("ports/gradle.properties")["port_version"]
          assets = {
              "Fabric": (f"mushoku-magic-{fabric_version}.jar", "fabric"),
              "Forge": (f"mushoku-magic-forge-1.20.1-{port_version}.jar", "forge"),
              "NeoForge": (f"mushoku-magic-neoforge-1.20.1-{port_version}.jar", "neoforge"),
          }
          root = Path("release-assets")
          for loader, (filename, metadata_kind) in assets.items():
              matches = list(root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {loader} jar named {filename}; found {matches}")
              jar_path = matches[0]
              with ZipFile(jar_path) as jar:
                  names = set(jar.namelist())
                  if metadata_kind == "fabric":
                      if "fabric.mod.json" not in names:
                          raise SystemExit(f"{jar_path} is missing Fabric metadata")
                  else:
                      if "fabric.mod.json" in names or "META-INF/mods.toml" not in names:
                          raise SystemExit(f"{jar_path} is not a native loader jar")
                      metadata = jar.read("META-INF/mods.toml").decode("utf-8")
                      has_luxium = 'modId="luxium"' in metadata
                      if has_luxium != (metadata_kind == "forge"):
                          raise SystemExit(f"Luxium dependency metadata is incorrect in {jar_path}")
              print(jar_path)
              print(f"Verified {loader}: {jar_path}")
          PY
          version="$(sed -n 's/^port_version=//p' ports/gradle.properties)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mapfile -t assets < <(find release-assets -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#assets[@]}" -ne 3 ]]; then
            echo "Expected exactly three runtime jars, found ${#assets[@]}: ${assets[*]}" >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}" > "$RUNNER_TEMP/release-assets.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-jars.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Highlights

          - Fixes Forge startup by deferring item construction until the item registry event.
          - Provides separate native Forge and NeoForge jars for Minecraft 1.20.1; the unchanged Fabric 1.21.11 jar is included for convenience.
          - The Forge jar declares Luxium and Embeddium as optional client-side dependencies. Luxium-specific weather rendering is not claimed; effects continue to use Minecraft particles.
          - Install only the jar matching the instance's loader.

          ## Verification

          - GitHub Actions passed for Fabric, Forge, and NeoForge builds and tests.
          - Loader metadata and the Forge-only optional Luxium declaration were verified in the published jars.
          EOF
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mushoku Tensei: Magic v${VERSION} — Native 1.20.1 ports" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
