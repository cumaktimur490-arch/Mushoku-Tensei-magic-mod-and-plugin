name: Build Mushoku Magic Mod

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --info

      - name: List build artifacts
        if: always()
        run: |
          echo "=== Build directory ==="
          ls -R build/ || true
          echo "=== Libs ==="
          ls -lh build/libs/ || true
          echo "=== Total ==="
          find build -type f | head -n 100

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-magic-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload sources JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mushoku-magic-sources
          path: build/libs/*-sources.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            **/build.log
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: mushoku-magic-mod
          path: ./artifacts

      - name: Create latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Последняя сборка мода"
          body: |
            Автоматически собранный мод (ветка ${{ github.ref_name }}, запуск ${{ github.run_number }}).
            Скачайте jar ниже и положите его в папку mods.
            
            Staff multipliers:
            - wand x2
            - migurd_staff x15
            - aqua_hartia_staff x50
          files: ./artifacts/*.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
